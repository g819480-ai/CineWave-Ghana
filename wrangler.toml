name = "cinewave-gh1"
main = "worker.js"
compatibility_date = "2026-05-03"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cinewave-ghana-db"
database_id = "006bc4cc-e09a-454a-95dc-6be69ec43589"

[[r2_buckets]]
binding = "MOVIES_BUCKET"
bucket_name = "cinewave-movies"

[vars]
# Server-side safety limits. These are maximums, not required upload sizes.
MAX_VIDEO_BYTES = "21474836480"
MAX_POSTER_BYTES = "10485760"
MAX_SUBTITLE_BYTES = "5242880"
